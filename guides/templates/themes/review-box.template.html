<a class="tbx-card" href="{{permalink}}" target="_blank" rel="noopener noreferrer">
  <div class="tbx-stars" aria-label="{{rating}} out of 5">{{stars}}</div>
  <p class="tbx-text">{{text}}</p>
  <div class="tbx-head">{{avatar}}<div class="tbx-who"><span class="tbx-author">{{author}}</span><time class="tbx-date" datetime="{{created_at}}">{{date}}</time></div><span class="tbx-net" data-net="{{network_slug}}" data-mark="{{network_mark}}" title="{{network_name}}"></span></div>
</a>
